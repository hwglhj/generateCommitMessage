name: Build and Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew (Unix)
      if: runner.os != 'Windows'
      run: chmod +x gradlew

    - name: Build with Gradle
      shell: bash
      run: ./gradlew "-Dorg.gradle.java.home=$JAVA_HOME" test verifyPlugin generateUpdatePluginsXml --no-daemon 2>&1 | tee build.log

    - name: Report Gradle failure
      if: failure()
      shell: bash
      run: python scripts/ci/01-report-build-failure.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        name: generateCommitMessage-plugin
        path: |
          build/distributions/*.zip
          build/distributions/updatePlugins.xml

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-reports-${{ matrix.os }}
        path: build/reports/
