name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Plugin
      run: ./gradlew buildPlugin

    - name: Get version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: SubMsg v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: build/distributions/*.zip
        body: |
          ## What's Changed

          See [CHANGELOG.md](https://github.com/hwglhj/submsg/blob/main/CHANGELOG.md) for details.

          ## Installation

          1. Download `SubMsg-${{ steps.version.outputs.VERSION }}.zip`
          2. Open IntelliJ IDEA → Settings → Plugins
          3. Click ⚙️ → Install Plugin from Disk...
          4. Select the downloaded zip file
          5. Restart IDE

          ## Quick Start

          See [INSTALL_GUIDE.md](https://github.com/hwglhj/submsg/blob/main/INSTALL_GUIDE.md) for detailed instructions.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
